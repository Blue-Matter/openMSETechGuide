project:
  type: book
  output-dir: docs
  post-render: fix-chapter-refs.R

book:
  title: "openMSE Technical Manual"
  author: "Adrian Hordyk, Quang Huynh, and Tom Carruthers"
  # cover-image: images/openMSE_logo.png
  description: |
    Management Strategy Evaluation with openMSE
  site-url: https://docs.openMSE.com/
  repo-url: https://github.com/blue-matter/openMSETechGuide/
  repo-actions: [edit]
  favicon: images/favicon.png
  date: today

  chapters:
    - index.qmd 
    - part: getting-started.qmd
      chapters:
        - overview-openMSE.qmd  
        - overview-objects.qmd  
        - example-objects.qmd    
        - example-mse.qmd 
    - part: mps-data-advice.qmd
      chapters:
        - object-data.qmd
        - conditioning-obs.qmd
        - generate-data.qmd
        - object-advice.qmd
        - management-procedures.qmd
        - example-mps.qmd    
    - part: developing-oms.qmd
      chapters:
        - om-built-in.qmd 
        - om-import-ss3.qmd
        - om-import-bam.qmd 
        - om-condition-rcm.qmd    
    - part: concept-overview.qmd
      chapters:
        - concept-schedules.qmd
        - concept-populate.qmd
        - concept-simulate-project.qmd
        - concept-complexes.qmd
        - concept-spatial.qmd
        - concept-ref-points.qmd

    - part: tech-overview.qmd
      chapters:
        - tech-notation.qmd
        - tech-populate-om.qmd
        - tech-life-history.qmd
        - tech-fleet-schedules.qmd
        - tech-unfished.qmd    
        - tech-historical.qmd
        - tech-observations.qmd
        - tech-reference-points.qmd
        - tech-projection.qmd
  appendices:
    - z-app-acknowledgements.qmd
    - z-app-changes_overview.qmd

  sidebar:
    title: 'Technical Manual'
    logo: "images/openMSE_logo.png"
    collapse-level: 1
    tools:
      - icon: globe
        href: https://openMSE.com
        text: "openMSE"
    search: true

format:
  html:
    theme: cosmo
    code-link: true




